[project]
name = "ein-utcp"
version = "0.1.0"
description = "Read-only UTCP toolbox for investigators: GET-only operations from shipped OpenAPI specs, digested results with handles to grep and read."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.10",
    "pyyaml>=6",
    "regex>=2024",
    "utcp>=1.1.3,<2",
    "utcp-http>=1.1.11,<2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
